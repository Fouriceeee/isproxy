[project]
name = "isproxy"
version = "1.0.0"
description = "A tiny stdlib-only reverse proxy for mapping 127.0.0.1:<port> to a target site"
readme = "README.md"
authors = [
    { name = "IronSword", email = "3232217212@qq.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cli = "isproxy:main"
gui = "isproxy.gui:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
